name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"] # Triggers on pushes to the main branch
  workflow_dispatch: # Allows you to manually trigger the build from the UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs in progress for faster queues
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages Engine
        uses: actions/configure-pages@v5

      - name: Upload Static Files Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads everything from your root folder. Change to './dist' if using Vite/React.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
